<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0D0E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MAHSA Health">
<title>MAHSA Health</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0B0D0E;--card:#15181B;--line:#23272B;--muted:#9AA3AB;--soft:#B5BDC4;--text2:#D3D8DC;--green:#2EE07A;--blue:#4DA3FF;--purple:#9B8CFF;--yellow:#F5C842;--red:#FF7A7A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:Inter,"SamsungOne",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#8CC4FF}
.num{font-family:"Space Grotesk","SF Pro Display",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:700}
#app{min-height:100%;display:flex;flex-direction:column}
.scroll{flex:1;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:12px;padding:20px 0 16px}
.ttl{font-family:"Space Grotesk",system-ui,sans-serif;font-size:24px;font-weight:700}
.sub{font-size:12px;color:var(--muted)}
.ib{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card{background:var(--card);border-radius:20px;padding:16px}
.stack{display:flex;flex-direction:column;gap:24px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
h2{margin:0;font-size:16px;font-weight:600}
.lbl{font-size:12px;font-weight:600;letter-spacing:.08em}
.chip{flex-shrink:0;height:36px;padding:0 16px;border-radius:18px;border:0;background:var(--card);color:var(--text2);font-size:13px;font-weight:600}
.chip.on{background:#fff;color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.seg{display:grid;gap:4px;background:var(--card);border-radius:14px;padding:4px}
.seg button{height:40px;border:0;border-radius:10px;background:transparent;color:var(--soft);font-size:13px;font-weight:600}
.seg button.on{background:#fff;color:var(--bg)}
.btn{height:56px;border-radius:16px;border:0;background:#fff;color:var(--bg);font-size:16px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:scale(.98)}
.badge{flex-shrink:0;font-size:11px;font-weight:600;padding:4px 10px;border-radius:10px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#111315;border-top:1px solid var(--line);padding:8px 4px calc(12px + env(safe-area-inset-bottom));z-index:10}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{border:0;background:transparent;color:#8A939B;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;min-height:56px;justify-content:center}
nav.tabs button.on{color:#fff}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes grow{from{stroke-dasharray:0 999}}
.ring circle.v{animation:grow 1.1s cubic-bezier(.2,.8,.2,1)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:flex-end;z-index:20;animation:fade .2s}
.sheet{background:var(--card);border-radius:24px 24px 0 0;padding:12px 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px;max-width:720px;width:100%;margin:0 auto}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;animation:fade .2s;max-width:90vw;text-align:center}
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(600px 400px at 50% 35%,rgba(46,224,122,.12),transparent 60%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px;text-align:center}
#splash img{width:min(78vw,340px)}
@media (min-width:700px){.t-g4{grid-template-columns:repeat(4,minmax(0,1fr))!important}}
</style>
</head>
