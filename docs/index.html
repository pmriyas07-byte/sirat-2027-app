<style>
:root{
  --bg:#F5F7F6; --card:#FFFFFF; --ink:#0E2219; --ink2:#33443C; --muted:#4A5B53; --line:#E1E8E4;
  --green:#0B6B3A; --deep:#0A4D2C; --tint:#E3F0E8; --gold:#F2CE3C; --sand:#FFF6D6; --sandInk:#4D3C00; --navy:#17295E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"SamsungOne","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
#app{min-height:100%;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
header.top{display:flex;align-items:center;gap:12px;padding:24px 0 16px}
.h-title{font-size:20px;font-weight:700}
.h-sub{font-size:12px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid #DCE5E0;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stack{display:flex;flex-direction:column;gap:32px}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--green)}
h1,h2{margin:0}
h2{font-size:20px}
.sec{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.small{font-size:12px;line-height:1.5;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;align-self:flex-start}
.btn{height:56px;border-radius:16px;border:0;background:var(--green);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 20px rgba(11,107,58,.25)}
.btn:active{transform:scale(.98)}
.seg{display:grid;gap:4px;background:#E6ECE9;border-radius:14px;padding:4px}
.seg button{height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:14px;font-weight:700}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(14,34,25,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex-shrink:0;height:38px;padding:0 14px;border-radius:999px;border:1px solid #DCE5E0;background:#fff;color:var(--ink2);font-size:12px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:12px;font-weight:700;color:var(--ink2)}
.field input,.field select{height:48px;border-radius:12px;border:1px solid #CBD6D0;background:#fff;padding:0 16px;font-size:15px;min-width:0;width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--green);outline-offset:1px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom));z-index:10}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;color:#5B6B63;font-size:11px;font-weight:700;padding:6px 0;min-height:56px;justify-content:center}
nav.tabs button.on{color:var(--green)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
.sheetbg{position:fixed;inset:0;background:rgba(14,34,25,.45);display:flex;flex-direction:column;justify-content:flex-end;z-index:20;animation:fade .2s}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:12px 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px;max-width:760px;width:100%;margin:0 auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:700;z-index:30;animation:fade .2s;max-width:90vw;text-align:center}
#splash{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px;text-align:center}
#splash img{width:160px;height:160px;object-fit:contain}
@media (min-width:700px){
  .t-grid3{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .t-grid2{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .t-grid6{grid-template-columns:repeat(6,minmax(0,1fr))!important}
  .hero h1{font-size:34px!important}
}
</style>
</head>

 } else {
  h+='<div class="fade" style="display:flex;flex-direction:column;gap:12px"><span class="eyebrow">OPENING CEREMONY · DAY 1</span><div class="t-grid2" style="display:grid;gap:12px">'+
  VIPS.map(function(v){return '<div class="card" style="display:flex;align-items:center;gap:16px"><span style="width:56px;height:56px;flex-shrink:0;border-radius:28px;background:var(--deep);color:var(--gold);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center">'+v[0]+'</span><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font-size:14px;font-weight:700">'+v[1]+'</span><span class="small" style="line-height:1.4">'+v[2]+'</span><span style="font-size:12px;font-weight:700;color:var(--green)">'+v[3]+'</span></div></div>';}).join('')+
  '</div><span class="eyebrow" style="padding-top:12px">FORUM SPEAKERS</span><div class="grid2 t-grid3">'+
  ['Keynote speaker','Panellist','Fireside guest','Moderator','Panellist','Keynote speaker'].map(function(l){return '<div class="card" style="border:1px dashed #A9B8B0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center"><span style="width:56px;height:56px;border-radius:28px;background:#E6ECE9;color:#5B6B63;display:flex;align-items:center;justify-content:center">'+ic('person')+'</span><span style="font-size:14px;font-weight:700">[Speaker name]</span><span class="small">'+l+'</span></div>';}).join('')+
  '</div><p class="small" style="text-align:center;margin:8px 0 0">Full speaker line-up to be announced.</p></div>';

function highlights(){
 return topBar('Forum Highlights','','home')+'<div class="stack fade">'+
 '<section style="background:var(--navy);border-radius:24px;padding:24px;color:#fff;display:flex;flex-direction:column;gap:12px" class="hero"><span style="font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--gold)">SIX SIGNATURE EXPERIENCES</span><h1 style="font-size:24px;line-height:1.25">From keynotes to the exhibition, built to move connection into collective action.</h1></section>'+

 '<section class="sec"><div style="display:flex;flex-direction:column;gap:4px"><h2>Five pillars</h2><span class="small">Turning the 10X ambition into action</span></div>'+PILLARS.map(function(p,i){return '<div style="display:flex;gap:12px;align-items:flex-start"><span style="width:32px;height:32px;flex-shrink:0;border-radius:10px;background:var(--green);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">'+(i+1)+'</span><div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:14px;font-weight:700">'+p[0]+'</span><span class="small">'+p[1]+'</span></div></div>';}).join('')+'</section>'+
 '<section class="sec"><h2>Who should attend</h2><div style="display:flex;flex-wrap:wrap;gap:8px">'+AUDIENCE.map(function(a){return '<span style="font-size:12px;font-weight:700;color:var(--deep);background:var(--tint);border-radius:999px;padding:8px 14px">'+a+'</span>';}).join('')+'</div></section>'+
 '<button class="btn" data-go="register" style="max-width:480px;margin:0 auto">Register for SIRAT 2027</button></div>';
}

function matching(){
 var req={};S.meetings.forEach(function(m){req[m.pid]=m.status;});
 var h='<header class="top"><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span class="h-title">Business Matching</span><span class="h-sub">Meet delegates and exhibitors on site</span></div><button class="iconbtn" data-act="lead" aria-label="Scan a badge">'+ic('scan',20)+'</button></header>'+
 '<div class="seg" role="tablist" style="grid-template-columns:1fr 1fr;margin-bottom:16px"><button data-mv="discover" class="'+(S.matchView==='discover'?'on':'')+'">Discover</button><button data-mv="meetings" class="'+(S.matchView==='meetings'?'on':'')+'">My meetings ('+S.meetings.length+')</button></div>';
 if(S.matchView==='discover'){
  var cats=['All','Trade & Investment','MSMEs & Startups','Ethical Finance','Education & Talent'];
  h+='<label style="display:flex;align-items:center;gap:8px;height:48px;border-radius:14px;border:1px solid #CBD6D0;background:#fff;padding:0 16px;color:#5B6B63;margin-bottom:12px">'+ic('search',18)+'<input type="search" aria-label="Search" placeholder="Search company, sector or country" style="border:0;outline:none;font-size:14px;flex:1;background:transparent;min-width:0;color:var(--ink)"></label>'+
  '<div class="chips" style="margin-bottom:12px">'+cats.map(function(c){return '<button class="chip '+(S.matchCat===c?'on':'')+'" data-mc="'+c+'">'+c+'</button>';}).join('')+'</div>'+
  '<div class="fade t-grid2" style="display:grid;gap:12px">'+PEOPLE.map(function(p,i){p.i=i;return p;}).filter(function(p){return S.matchCat==='All'||p.cat===S.matchCat;}).map(function(p){var st=req[p.i];
   return '<article class="card" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;gap:12px;align-items:center"><span style="width:48px;height:48px;flex-shrink:0;border-radius:14px;background:var(--tint);color:var(--green);display:flex;align-items:center;justify-content:center">'+ic('bldg',22)+'</span><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;font-weight:700">[Company name]</span><span class="small">[Name], [Title] · '+p.country+'</span></div></div>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="tag" style="background:var(--tint);color:var(--deep)">'+p.cat+'</span><span class="tag" style="background:#EEF1F0;color:var(--ink2)">'+p.type+'</span></div>'+
   '<span class="small">Looking for: [partners, investors or buyers]</span>'+
   '<button data-req="'+p.i+'" style="height:44px;border-radius:12px;font-size:14px;font-weight:700;'+(st?'background:var(--tint);color:var(--deep);border:1px solid var(--tint)':'background:var(--green);color:#fff;border:1px solid var(--green)')+'">'+(st?(st==='Accepted'?'✓ Meeting confirmed':'Request sent'):'Request meeting')+'</button></article>';}).join('')+'</div>';
 } else {
  h+='<div class="fade t-grid2" style="display:grid;gap:12px">'+(S.meetings.length?S.meetings.map(function(m){var ok=m.status==='Accepted';
   return '<article class="card" style="display:flex;gap:16px;align-items:center"><div style="width:68px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--deep);color:#fff;border-radius:12px;padding:8px 4px"><span style="font-size:11px;color:var(--gold);font-weight:700">'+m.day+'</span><span style="font-size:14px;font-weight:700">'+m.time+'</span></div>'+
   '<div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0"><span style="font-size:14px;font-weight:700">[Company name]</span><span class="small">'+PEOPLE[m.pid].cat+' · Business Matching Lounge</span><span class="tag" style="'+(ok?'background:var(--green);color:#fff':'background:var(--sand);color:var(--sandInk)')+'">'+m.status+'</span>'+
   (ok?'':'<button data-acc="'+m.pid+'" style="align-self:flex-start;border:0;background:transparent;color:var(--green);font-size:12px;font-weight:700;padding:4px 0">Demo: mark as accepted</button>')+'</div></article>';}).join('')
   :'<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 16px;text-align:center"><span style="width:64px;height:64px;border-radius:32px;background:var(--tint);color:var(--green);display:flex;align-items:center;justify-content:center">'+ic('cal',28)+'</span><span style="font-size:16px;font-weight:700">No meetings yet</span><span class="small" style="font-size:14px">Request a meeting from Discover.</span></div>')+'</div>';
 }
 return h;
}
function sheet(){
 if(S.sheet===null)return '';
 return '<div class="sheetbg" data-act="closeSheet"><div class="sheet" role="dialog" aria-label="Request a meeting" data-stop="1"><span style="align-self:center;width:40px;height:4px;border-radius:2px;background:#CBD6D0"></span>'+
 '<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:20px;font-weight:700">Request a meeting</span><span class="small">[Company name] · '+PEOPLE[S.sheet].cat+' · pick a free slot</span></div>'+
 '<div class="grid2" style="gap:8px">'+SLOTS.map(function(s,i){var on=S.slot===i;return '<button data-slot="'+i+'" aria-pressed="'+on+'" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:12px;'+(on?'background:var(--deep);color:#fff;border:2px solid var(--deep)':'background:#fff;color:var(--ink);border:2px solid var(--line)')+'"><span style="font-size:11px;font-weight:700">'+s[0]+'</span><span style="font-size:15px;font-weight:700">'+s[1]+'</span></button>';}).join('')+'</div>'+
 '<div style="display:flex;gap:12px"><button data-act="closeSheet" style="flex:1;height:52px;border-radius:14px;border:1px solid #CBD6D0;background:#fff;font-size:14px;font-weight:700">Cancel</button><button data-act="sendReq" style="flex:2;height:52px;border-radius:14px;border:0;background:var(--green);color:#fff;font-size:14px;font-weight:700">Send request</button></div></div></div>';
}

/* ---------- RENDER ---------- */
var SCREENS={home:home,register:register,pass:pass,agenda:agenda,speakers:speakers,highlights:highlights,matching:matching};
var TABS=[['home','home','Home'],['agenda','cal','Programme'],['speakers','mic','Speakers'],['matching','users','Matching'],['pass','qr','My Pass']];
var app=document.getElementById('app');
function render(keepScroll){
 var sc=app.querySelector('.scroll');var top=keepScroll&&sc?sc.scrollTop:0;
 app.innerHTML='<div class="scroll"><div class="wrap">'+SCREENS[S.screen]()+'</div></div>'+
 '<nav class="tabs" aria-label="Main"><div class="in">'+TABS.map(function(t){var on=S.screen===t[0]||(t[0]==='home'&&(S.screen==='register'||S.screen==='highlights'));return '<button data-go="'+t[0]+'" class="'+(on?'on':'')+'" '+(on?'aria-current="page"':'')+'>'+ic(t[1])+t[2]+'</button>';}).join('')+'</div></nav>'+sheet();
 var ns=app.querySelector('.scroll');if(ns)ns.scrollTop=top;
}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2200);}
function goFull(){var d=document.documentElement;var f=d.requestFullscreen||d.webkitRequestFullscreen;if(f&&!document.fullscreenElement){try{var p=f.call(d);if(p&&p.catch)p.catch(function(){});}catch(e){}}}
function saveForm(){var n=document.getElementById('f-name'),o=document.getElementById('f-org');if(n)S.regName=n.value.trim();if(o)S.regOrg=o.value.trim();}

app.addEventListener('click',function(e){
 var el=e.target.closest('button,[data-act]');if(!el)return;
 var d=el.dataset;
 if(d.stop&&!e.target.closest('button'))return;
 if(d.go){if(S.screen==='register')saveForm();S.screen=d.go;S.sheet=null;render();return;}
 if(d.day!==undefined){S.day=+d.day;render();return;}
 if(d.spv){S.spkView=d.spv;render();return;}
 if(d.spf){S.spkFilter=d.spf;render(true);return;}
 if(d.save){S.saved[d.save]=!S.saved[d.save];render(true);if(S.saved[d.save])toast('Added to your agenda');return;}
 if(d.pass){saveForm();S.pass=d.pass;render(true);return;}
 if(d.rs){saveForm();S.regSess[d.rs]=!S.regSess[d.rs];render(true);return;}
 if(d.mv){S.matchView=d.mv;render();return;}
 if(d.mc){S.matchCat=d.mc;render(true);return;}
 if(d.req!==undefined){var pid=+d.req;if(!S.meetings.some(function(m){return m.pid===pid;})){S.sheet=pid;S.slot=0;render(true);}return;}
 if(d.slot!==undefined){S.slot=+d.slot;render(true);return;}
 if(d.acc!==undefined){S.meetings.forEach(function(m){if(m.pid===+d.acc)m.status='Accepted';});render(true);toast('Meeting confirmed');return;}
 switch(d.act){
  case 'fs':goFull();break;
  case 'regSubmit':saveForm();S.registered=true;render();break;
  case 'regReset':S.registered=false;S.regName='';S.regOrg='';render();break;
  case 'checkIn':S.checkedIn=true;render(true);if(navigator.vibrate)navigator.vibrate(60);break;
  case 'resetCheck':S.checkedIn=false;render(true);break;
  case 'closeSheet':if(e.target===el||el.tagName==='BUTTON'){S.sheet=null;render(true);}break;
  case 'sendReq':var s=SLOTS[S.slot];S.meetings.push({pid:S.sheet,day:s[0].split(' ·')[0],time:s[1].replace(/ (AM|PM)/,''),status:'Pending'});S.sheet=null;S.matchView='meetings';render();toast('Meeting request sent');break;
  case 'lead':toast('Exhibitors: scan a visitor badge to capture the lead');break;
 }
});
document.getElementById('startBtn').addEventListener('click',function(){goFull();document.getElementById('splash').remove();});
render();
})();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
