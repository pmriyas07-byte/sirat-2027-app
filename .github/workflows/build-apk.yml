name: Build SIRAT APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SIRAT-2027.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SIRAT-2027-apk
          path: SIRAT-2027.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SIRAT 2027 App (build ${{ github.run_number }})
          body: Download SIRAT-2027.apk below and open it on your Android phone or tablet to install.
          files: SIRAT-2027.apk
          make_latest: true
