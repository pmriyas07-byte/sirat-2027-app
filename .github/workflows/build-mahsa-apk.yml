name: Build MAHSA Health APK
on:
  push:
    branches: [ main ]
    paths: [ 'mahsa-android/**', '.github/workflows/build-mahsa-apk.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mahsa-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../MAHSA-Health.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mahsa-build-${{ github.run_number }}
          name: MAHSA Health App (build ${{ github.run_number }})
          body: Download MAHSA-Health.apk below and open it on an Android phone or tablet to install. Prototype with sample data.
          files: MAHSA-Health.apk
          make_latest: false
