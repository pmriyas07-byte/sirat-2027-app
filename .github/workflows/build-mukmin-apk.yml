name: Build MUKMIN APK
on:
  push:
    branches: [ main ]
    paths: [ 'mukmin-android/**', '.github/workflows/build-mukmin-apk.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mukmin-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../MUKMIN.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mukmin-build-${{ github.run_number }}
          name: MUKMIN App (build ${{ github.run_number }})
          body: Download MUKMIN.apk below and open it on an Android phone or tablet to install. Prototype with sample data.
          files: MUKMIN.apk
          make_latest: false
